<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Content Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>AI Content Studio</h1>
    <p class="subtitle">快速生成你的营销文案</p>

    <section class="card">
      <label for="topic">主题</label>
      <input
        id="topic"
        type="text"
        placeholder="例如：瑜伽垫"
      >

<label for="platform">发布平台</label>
<select id="platform">
  <option value="全平台通用" selected>全平台通用</option>
  <option value="小红书">小红书</option>
  <option value="抖音">抖音</option>
  <option value="微信公众号">微信公众号</option>
  <option value="视频号">视频号</option>
  <option value="微博">微博</option>
  <option value="知乎">知乎</option>
  <option value="B站">B站</option>
  <option value="快手">快手</option>
  <option value="朋友圈">朋友圈</option>
</select>

<label for="style">内容风格</label>
<select id="style">
  <option value="真实种草" selected>真实种草</option>
  <option value="专业可信">专业可信</option>
  <option value="轻松幽默">轻松幽默</option>
  <option value="文艺治愈">文艺治愈</option>
  <option value="简洁直接">简洁直接</option>
  <option value="真诚分享">真诚分享</option>
  <option value="干货教程">干货教程</option>
  <option value="故事叙述">故事叙述</option>
  <option value="情绪共鸣">情绪共鸣</option>
  <option value="高端质感">高端质感</option>
  <option value="促销转化">促销转化</option>
</select>

<label for="audience">目标受众</label>
<input
  id="audience"
  type="text"
  maxlength="100"
  value="普通用户"
  placeholder="例如：20—30 岁职场女性"
>

<label for="length">文案长度</label>
<select id="length">
  <option value="short">短：约 60—100 字</option>
  <option value="medium" selected>中：约 180—300 字</option>
  <option value="long">长：约 400—650 字</option>
</select>

      <button id="generate-button" type="button">生成文案</button>
    </section>

<section class="card result-card">
  <div class="result-header">
    <h2>生成结果</h2>
    <button id="copy-all-button" type="button" disabled>
      复制全部
    </button>
  </div>

  <div id="result-empty-state" class="result-empty-state">
    请填写主题，然后点击“生成文案”。
  </div>

  <div id="result-content" class="result-content" hidden>
    <div class="result-section">
      <div class="result-section-header">
        <h3>标题</h3>
        <button id="copy-title-button" type="button">复制标题</button>
      </div>
      <p id="result-title" class="result-title"></p>
    </div>

    <div class="result-section">
      <div class="result-section-header">
        <h3>正文</h3>
        <button id="copy-body-button" type="button">复制正文</button>
      </div>
      <p id="result-body" class="result-body"></p>
    </div>

    <div class="result-section">
      <h3>标签</h3>
      <div id="result-hashtags" class="result-hashtags"></div>
    </div>
  </div>
</section>

<section class="card optimizer-card">
  <div class="optimizer-header">
    <div>
      <h2>文案优化器</h2>
      <p class="optimizer-description">
        粘贴已有文案，选择优化目标，让 AI 帮你改得更好。
      </p>
    </div>
    <button id="use-generated-content-button" type="button">
      使用当前生成结果
    </button>
  </div>

  <label for="optimize-content">待优化文案</label>
  <textarea
    id="optimize-content"
    rows="8"
    maxlength="5000"
    placeholder="粘贴一段你想优化的文案"
  ></textarea>

  <label for="optimize-goal">优化目标</label>
  <select id="optimize-goal">
    <option value="更简洁" selected>更简洁</option>
    <option value="更有吸引力">更有吸引力</option>
    <option value="更专业">更专业</option>
    <option value="更适合小红书">更适合小红书</option>
  </select>

  <button id="optimize-button" type="button">优化文案</button>

  <div id="optimize-empty-state" class="result-empty-state">
    粘贴文案后，选择优化目标并点击“优化文案”。
  </div>

  <div id="optimize-result-content" class="result-content" hidden>
    <div class="result-section">
      <div class="result-section-header">
        <h3>优化结果</h3>
        <button id="copy-optimized-button" type="button" disabled>
          复制优化结果
        </button>
      </div>
      <p id="optimized-content" class="result-body"></p>
    </div>
  </div>
</section>

<section class="card history-card">
  <div class="history-header">
    <h2>历史记录</h2>
    <button id="refresh-history-button" type="button">
      刷新历史
    </button>
  </div>

  <div id="history-list">
    <p class="history-message">正在加载历史记录...</p>
  </div>

  <button id="load-more-button" type="button">
    加载更多
  </button>
</section>
  </main>

  <script src="app.js"></script>
</body>
</html>
